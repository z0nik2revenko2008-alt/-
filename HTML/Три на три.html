<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Три на три</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&display=swap">
<style>
:root{--bg:#08080a;--card:#15130f;--line:#8a6d3b;--tx:#e8e0cc;--mut:#9c927a;--gold:#d4af5f;--red:#c0392b;--grn:#5fbf6a;--blu:#6aa0d8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:#08080a;color:#e8e0cc;font-family:Philosopher,Georgia,serif;font-size:18px;min-height:100%}
h1,h2{font-family:Philosopher,Georgia,serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0;color:#e6d6a2}
main{max-width:1100px;margin:0 auto;padding:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.hint{color:var(--mut);font-size:15px;min-height:20px;margin:6px 0}
.row{display:flex;gap:10px;justify-content:center;margin:8px 0}
.team{border-radius:12px;padding:6px;border:2px solid transparent}
.team.on{border-color:var(--gold)}
.tn{font-size:13px;color:var(--mut);margin:0 0 4px 4px}
.card{flex:1 1 0;max-width:220px;min-width:0;background:var(--card);border:3px solid #3b3020;border-radius:12px;padding:6px;cursor:pointer;position:relative;font-size:14px}
.card.sel{border-color:var(--gold)}
.card.tgt{border-color:var(--grn);box-shadow:0 0 12px #3dff5c88}
.card.dead{opacity:.3;filter:grayscale(1);cursor:default}
.card.done{opacity:.6}
.nm{text-align:center;border-bottom:1px solid var(--line);padding-bottom:3px;font-weight:700;font-size:16px}
.art{height:92px;border:1px solid var(--line);margin:5px 0;display:flex;align-items:center;justify-content:center;font-size:60px;background:#0d0c0a}
.st{line-height:1.4}
.cost{color:var(--blu)}
.ab{font-size:13px;margin-top:3px}
.hp{height:10px;background:#111;border-radius:5px;overflow:hidden;margin:4px 0}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#d33,#ec4)}
.tags{min-height:18px;font-size:12px}
button{font:inherit;color:#e8e0cc;background:#1c1a14;border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer;letter-spacing:.03em}
button:hover:not(:disabled){background:#2d2818}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.pri{background:var(--gold);color:#221;border-color:var(--gold);font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#log{background:#060608;border-radius:10px;padding:8px 10px;height:230px;overflow-y:auto;font-size:15px;line-height:1.5;color:#cfc7b0}
#log p{margin:0 0 3px}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.pool .card{flex:0 0 calc(33% - 10px);max-width:none}
.ov{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:9;text-align:center}
.ov div{background:var(--card);padding:28px 36px;border-radius:14px;border:3px solid var(--gold)}
@media(max-width:520px){.card{font-size:12px;padding:4px}.art{height:64px;font-size:40px}.pool .card{flex-basis:calc(50% - 10px)}}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
#stage{width:100%;border-radius:12px;overflow:hidden;background:#060608;line-height:0}
#stage canvas{display:block;touch-action:manipulation}
.dicebox{display:flex;gap:14px;align-items:center;background:#060608;border-radius:10px;padding:10px;margin:8px 0}
.die{flex:none;width:72px;height:72px;border-radius:14px;background:#f4f1ff;color:#221;font:400 38px 'Russo One',Arial,sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #8d8bb0}
.dlab{color:var(--mut);font-size:12px}
.formula{font-size:17px;line-height:1.6}
.formula b{color:var(--gold)}
@media(prefers-reduced-motion:no-preference){.die.roll{animation:wob .25s infinite}}
@keyframes wob{0%,100%{transform:rotate(-12deg) translateY(-4px)}50%{transform:rotate(10deg) translateY(2px)}}
#stage{position:relative}
.wheel{position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);line-height:1.2;text-align:center;z-index:5;cursor:pointer;touch-action:manipulation}
.wheel canvas{display:block;filter:drop-shadow(0 6px 10px #000a)}
.wlab{font:700 26px Philosopher,Georgia,serif;letter-spacing:.08em;color:#fff;text-shadow:0 2px 0 #000,0 0 8px #000;margin-top:6px;white-space:nowrap}
@media(prefers-reduced-motion:no-preference){.wheel.spin .wlab{animation:pls .6s infinite alternate}.wheel.done canvas{animation:pop .3s}}
@keyframes pls{from{opacity:.45}to{opacity:1}}
@keyframes pop{50%{transform:scale(1.1)}}
</style>
</head>

 addF(f);
 await lunge(h,t);hurt(t,dmg,h,crit,o.back?(t.actedRound!==G.round?2:1):0);await sleep(350);await back(h);
 if(o.ice&&t.alive){t.frozen=true;t.ice=true;iceSfx();floatText('ЗАМОРОЖЕН',bx(t),bz(t)+.9,'#8fd8ff',1.1,1400,1.6);burst(bx(t),bz(t),'#8fd8ff',20);say(`❄ ${t.n} скован льдом.`);}
}
function hurt(t,x,src,crit,blood){
 if(t.shield){const y=Math.ceil(x*.3);addF(`🔥 Огненный щит: ${x} × 0.3 = ${y}`);x=y;}
 t.hp-=x;const now=performance.now();t.shake=now+400;t.tint=0xff5555;t.tintUntil=now+400;
 burst(bx(t)+(t.ox||0),bz(t)+(t.oz||0),src?src.col:'#ffffff',crit?30:16);
 floatText('-'+x,bx(t),bz(t),crit?'#ffd23a':'#ff5a5a',crit?1.5:1.1);
 if(blood)bloodFx(t,blood);if(crit){R.shk=now+350;floatText('КРИТ!',bx(t),bz(t)+.9,'#ffd23a',1.2,1300,1.6);sfx(90,350,'sawtooth',.1,40);}else sfx(140,200,'sawtooth',.08,60);say(`   ${t.n} получает ${x} урона (${Math.max(0,t.hp)}/${t.max}).`);
 if(t.hp<=0){t.hp=0;t.alive=false;if(!G.fb){G.fb=1;playSnd('fb');R.shk=performance.now()+300;later(()=>floatText('ПЕРВАЯ КРОВЬ!',0,0,'#ff3a3a',2,2200,1.4),300);say('🩸 ПЕРВАЯ КРОВЬ!');}floatText('ПОВЕРЖЕН!',bx(t),bz(t)+.9,'#ffffff',1.1,1500,1.6);burst(bx(t),bz(t),'#888888',24);say(`💥 ${t.n} повержен!`);}
 sync3D();
}
function finish(h,msg){
 if(msg)say(msg);
 h.acted=true;h.actedRound=G.round;G.sel=null;G.mode=null;G.hint='';
 G.teams.forEach((tm,i)=>{if(tm.every(x=>!x.alive))G.over=2-i;});
 if(!G.over&&(G.ap[G.cur]<1||mine().every(x=>!x.alive||x.acted)))G.hint='Ходить больше нечем — нажмите «Закончить ход».';
 render();
}

function panel(){
 const h=G.sel;
 if(!h)return `<div class="hint">${G.hint||'Выберите героя своей команды (жёлтая рамка), чтобы сделать действие.'}</div>`;
 const btn=(m,l,ok,tip='')=>`<button ${ok?'':'disabled'} title="${tip}" onclick="act('${m}')">${l}</button>`;
 const abs=h.ab.map(a=>{
  const cd=h.cd[a.id]||0,self=a.id==='invis'||a.id==='shield';
  const ok=cd===0&&AP[h.id][a.id]<=G.ap[G.cur]&&(self||targetsFor(h,a.id).length>0);
  return btn(a.id,`${a.n} ⚡${AP[h.id][a.id]}${cd?` (⏳${cd})`:''}`,ok,a.t);}).join('');
 return `<div class="hint">${G.hint}</div><div class="acts">${btn('attack','⚔ Атака ⚡'+AP[h.id].attack,AP[h.id].attack<=G.ap[G.cur]&&targetsFor(h,'attack').length>0)}${abs}${btn('defend','🛡 Защита ⚡1',G.ap[G.cur]>=1,'+3 к защите до вашего след. хода')}<button onclick="G.sel=null;G.mode=null;G.hint='';render()">Отмена</button></div>
 <div class="hint">${h.ab.map(a=>a.n+': '+a.t).join(' · ')}${h.pas?' · '+h.pas:''}</div>`;
}
function battleView(){
 return `<div class="bar"><h2>Раунд ${G.round} · ход игрока ${G.cur+1}</h2><b style="color:var(--gold)">⚡ <span id="ap">${G.ap[G.cur]}</span>/${APT}</b>
  <span><button class="pri" onclick="endTurn()">Закончить ход</button> <button onclick="MUTE=!MUTE;this.textContent=MUTE?'🔇':'🔊'">${MUTE?'🔇':'🔊'}</button> <button onclick="newGame()">Заново</button></span></div>
 <div id="stage"></div>
 <div class="hint">Сверху игрок 2, снизу игрок 1. Нажимайте на карты на столе.</div>
 <div class="dicebox"><div class="formula" id="formula">${G.die.f}</div></div>
 <div class="hint">🎡 Атака — колесо: нажмите, чтобы остановить меч. Красное — промах, зелёное — удар, тёмно-зелёное — крит (+50% урона). 💥 Урон: сила − защита + бросок 1–6; один удар не отнимает больше 40% макс. здоровья цели. 💚 Лечение: два броска 1–4.</div>
 ${panel()}<div id="log">${G.log.map(l=>`<p>${l}</p>`).join('')}</div>
 ${G.over?`<div class="ov"><div><h1>🏆 Победил игрок ${G.over}!</h1><p>Отряд противника уничтожен.</p><button class="pri" onclick="newGame()">Играть снова</button></div></div>`:''}`;
}
function render(){
 $('app').innerHTML=G?battleView():draftView();
 if(G){$('stage').appendChild(R.rd.domElement);fit();sync3D();}
}
try{document.fonts.load('700 20px Philosopher');}catch(e){}
newGame();
</script>
</body>
</html>
